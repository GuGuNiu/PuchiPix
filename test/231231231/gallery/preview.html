<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图库角色索引</title>
  <style>
    @font-face {
      font-family: 'Number';
      src: url="../common/font/tttgbnumber.woff") format('woff'), url("../common/font/tttgbnumber.ttf") format('truetype');
    }
    @font-face {
      font-family: 'NZBZ';
      src: url("../common/font/NZBZ.woff") format('woff'), url("../common/font/NZBZ.ttf") format('truetype');
    }
    @font-face {
      font-family: 'YS';
      src: url("../common/font/HYWH-65W.woff") format('woff'), url("../common/font/HYWH-65W.ttf") format('truetype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Number, "汉仪文黑-65W", YS, PingFangSC-Medium, "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
      padding: 30px;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-family: NZBZ, "印品南征北战NZBZ体", sans-serif;
      font-size: 48px;
      color: #f8fafc;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      letter-spacing: 4px;
    }
    .header .subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 8px;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 20px 0;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: #38bdf8;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0 30px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(30, 41, 59, 0.6);
      color: #cbd5e1;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .role-card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .role-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.2);
    }
    .role-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .role-card:hover::before {
      opacity: 1;
    }
    .role-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, #334155 0%, #1e293b 100%);
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      border: 2px solid rgba(148, 163, 184, 0.2);
    }
    .role-name {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }
    .role-count {
      font-size: 11px;
      color: #64748b;
    }
    .role-count.has-images {
      color: #38bdf8;
    }
    .element-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #475569;
    }
    .element-cryo { background: #67e8f9; }
    .element-hydro { background: #3b82f6; }
    .element-pyro { background: #ef4444; }
    .element-electro { background: #a855f7; }
    .element-anemo { background: #2dd4bf; }
    .element-geo { background: #fbbf24; }
    .element-dendro { background: #4ade80; }
    .element-quantum { background: #c084fc; }
    .element-imaginary { background: #f472b6; }
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
      color: #475569;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>图 库 角 色 索 引</h1>
    <div class="subtitle">ProfileImg · 面板图库总览</div>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="totalRoles">0</div>
        <div class="stat-label">收录角色</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">1,234</div>
        <div class="stat-label">面板图片</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">12</div>
        <div class="stat-label">图库来源</div>
      </div>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active">全部</button>
      <button class="filter-btn">❄ 冰</button>
      <button class="filter-btn">💧 水</button>
      <button class="filter-btn">🔥 火</button>
      <button class="filter-btn">⚡ 雷</button>
      <button class="filter-btn">🌪 风</button>
      <button class="filter-btn">🪨 岩</button>
      <button class="filter-btn">🌿 草</button>
    </div>
  </div>

    <!-- 角色卡片由 map.json 数据生成 -->

    };

    // 生成角色卡片
    const grid = document.getElementById('roleGrid');
    const roles = Object.keys(roleMap);
    document.getElementById('totalRoles').textContent = roles.length;

    roles.forEach(role => {
      const element = elementMap[role] || 'geo';
      const count = roleMap[role];
      const card = document.createElement('div');
      card.className = 'role-card';
      card.innerHTML = `
        <span class="element-icon element-${element}"></span>
        <div class="role-avatar">${elementIcons[element] || '?'}</div>
        <div class="role-name">${role}</div>
        <div class="role-count ${count > 0 ? 'has-images' : ''}">${count > 0 ? count + ' 张面板图' : '暂无数据'}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
