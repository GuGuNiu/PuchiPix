<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images 资源预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-panel {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
    }
    .preview-panel h1 {
      font-size: 28px;
      color: #f8fafc;
      margin-bottom: 10px;
    }
    .preview-panel .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
    }
    .icon-display {
      background: rgba(15, 23, 42, 0.6);
      border: 2px dashed rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
    }
    .icon-display img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
    }
    .file-info {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 8px;
      padding: 15px;
      text-align: left;
    }
    .file-info .label {
      color: #64748b;
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .file-info .value {
      color: #38bdf8;
      font-size: 14px;
      font-family: monospace;
      margin-bottom: 10px;
    }
    .file-info .value:last-child {
      margin-bottom: 0;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #475569;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="preview-panel">
    <h1>Images 资源目录</h1>
    <div class="subtitle">静态图片素材预览</div>

    <div class="icon-display">
      <img src="icon.jpg" alt="icon" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
      <div style="display:none; align-items:center; justify-content:center; height:100px; color:#475569; font-size:14px;">
        图片加载失败（路径: icon.jpg）
      </div>
    </div>

    <div class="file-info">
      <div class="label">文件名</div>
      <div class="value">icon.jpg</div>
      <div class="label">用途</div>
      <div class="value">帮助页面图标精灵图（sprite）</div>
      <div class="label">引用位置</div>
      <div class="value">help/index.css → .help-icon { background: url('icon.png') ... }</div>
    </div>

    <div class="note">
      该目录存放页面所需的静态图片资源。<br/>
      icon.jpg / icon.png 为帮助页面命令图标精灵表，包含所有可用命令的小图标。
    </div>
  </div>
</body>
</html>
