<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色图片可视化 - 甘雨</title>
    <style>
/* 面板图可视化 — 浅色现代简洁风
   资源相对路径以本文件位置（resources/visualize/）为基准 */

:root {
  --text-primary: #1e3a8a;
  --text-secondary: #475569;
  --title-color: #1e3a8a;
  --accent: #2563eb;
  --line-color: rgba(148, 163, 184, 0.18);
  --line-strong: rgba(148, 163, 184, 0.3);
  --card-bg: #ffffff;
  --card-shadow: rgba(30, 41, 59, 0.06);
  --error-text-color: #dc2626;
  --error-bg-color: #fef2f2;
}

/* 本地字体：数字/英文用 tttgbnumber，标题用 NZBZ */
@font-face {
  font-family: 'Number';
  src: url('../common/font/tttgbnumber.woff') format('woff'), url('../common/font/tttgbnumber.ttf') format('truetype');
}
@font-face {
  font-family: 'NZBZ';
  src: url('../common/font/NZBZ.woff') format('woff'), url('../common/font/NZBZ.ttf') format('truetype');
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  margin: 0 auto;
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.6;
  width: 1000px;
  /* 浅色渐变 + 少量柔和光效 */
  background:
    radial-gradient(900px 360px at 12% -10%, rgba(147, 197, 253, 0.16), transparent 60%),
    radial-gradient(900px 360px at 90% 112%, rgba(196, 181, 253, 0.13), transparent 60%),
    linear-gradient(180deg, #f8fafc 0%, #eef2f9 100%);
}

.container {
  background-color: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--line-color);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
}

/* ============================ header ============================ */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 38px 40px 28px;
  /* 浅色渐变横幅 + 顶部柔和光效 */
  background:
    radial-gradient(620px 260px at 100% -40%, rgba(147, 197, 253, 0.3), transparent 65%),
    linear-gradient(180deg, #fbfdff 0%, #eef4fc 100%);
  border-bottom: 1px solid var(--line-color);
  position: relative;
  overflow: hidden;
}

.header-content-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  z-index: 2;
}

.main-title {
  position: relative;
  font-size: 40px;
  color: var(--title-color);
  font-family: 'NZBZ', 'Microsoft YaHei', sans-serif;
  font-weight: 400;
  letter-spacing: 2px;
  line-height: 1.2;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.7);
}

.title-divider {
  width: 180px;
  height: 3px;
}

.divider-line {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent) 0%, rgba(37, 99, 235, 0.1) 100%);
}

.header-stats-area {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  margin-left: auto;
  z-index: 2;
}

.stat-card {
  display: flex;
  align-items: center;
  gap: 22px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 10px 26px;
  box-shadow: 0 4px 16px rgba(30, 64, 175, 0.06);
}

.stat-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.stat-label {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
  letter-spacing: 3px;
}

.stat-value {
  font-family: 'Number', 'Microsoft YaHei', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: var(--title-color);
  line-height: 1.2;
}

.stat-divider {
  width: 1px;
  height: 34px;
  background: var(--line-strong);
}

.pagination-info {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #64748b;
  font-family: 'Number', monospace;
  font-size: 13px;
  font-weight: 700;
  padding: 5px 16px;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border-radius: 20px;
  border: 1px solid var(--line-color);
}

.page-number {
  color: var(--accent);
  font-size: 15px;
  font-weight: 800;
}

/* ============================ main ============================ */

.main-content {
  padding: 30px;
  /* 淡网格纹理 */
  background:
    linear-gradient(rgba(148, 163, 184, 0.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148, 163, 184, 0.09) 1px, transparent 1px);
  background-size: 28px 28px;
}

.ban-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  list-style: none;
  margin: 0;
}

.ban-item {
  background-color: var(--card-bg);
  border-radius: 12px;
  padding: 8px;
  border: 1px solid var(--line-color);
  box-shadow: 0 2px 8px var(--card-shadow);
  display: flex;
  flex-direction: column;
  text-align: center;
  position: relative;
}

.ban-item img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 8px;
  background-color: #ffffff;
  border: 1px solid rgba(148, 163, 184, 0.14);
}

.ban-item .error-placeholder {
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background-color: var(--error-bg-color);
  color: var(--error-text-color);
  font-size: 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  padding: 15px;
  border: 1px dashed var(--error-text-color);
  text-align: center;
  word-break: break-all;
}

.filename-area {
  margin-top: auto;
  padding-top: 5px;
}

.ban-item .filename {
  font-size: 13px;
  color: var(--text-secondary);
  word-break: break-all;
  line-height: 1.4;
  font-weight: 600;
}

/* ============================ footer ============================ */

.footer {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  margin-top: 20px;
  padding-bottom: 16px;
  background: transparent;
  border-top: none;
}

.footer-content .copyright {
  font-size: 14px;
  font-style: italic;
  text-align: center;
  color: #64748b;
  opacity: 0.55;
  white-space: nowrap;
  line-height: 1;
}
    </style>
</head>
