services:
  puchipix:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: puchipix
    ports:
      - "10540:80"
    depends_on:
      - go-backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:80/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  go-backend:
    image: puchipix-backend:latest
    container_name: puchipix-backend
    ports:
      - "10541:10541"
    restart: unless-stopped
