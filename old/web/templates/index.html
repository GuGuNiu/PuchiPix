<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuchiPix - 图像抓取工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-image mr-2"></i>PuchiPix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#dashboard">主页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#tasks">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#history">历史记录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#settings">设置</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="container mt-5 pt-5">
        <!-- 欢迎面板 -->
        <div id="dashboard" class="card card-hover shadow-lg mb-5 transform-on-hover">
            <div class="card-body">
                <h1 class="text-center mb-4">欢迎使用 PuchiPix</h1>
                <p class="text-center text-muted mb-5">高效的图像抓取工具</p>
                
                <!-- 添加任务表单 -->
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <form id="task-form" class="mb-5">
                            <div class="input-group">
                                <input type="text" id="url-input" class="form-control form-control-lg" placeholder="输入要抓取的URL..." required>
                                <button class="btn btn-outline-secondary" type="button" id="clipboard-btn" onclick="createTaskFromClipboard()">
                                    <i class="fas fa-paste"></i>
                                </button>
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-download mr-2"></i>开始抓取
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 简化的统计卡片 -->
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card bg-primary text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-tasks fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">总任务数</h5>
                                <p class="card-text display-4" id="total-tasks">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-success text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-check-circle fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">成功任务</h5>
                                <p class="card-text display-4" id="success-tasks">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-warning text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-spinner fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">进行中</h5>
                                <p class="card-text display-4" id="running-tasks">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 任务管理 -->
        <div id="tasks" class="card card-hover shadow-lg mb-5 transform-on-hover">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">
                    <i class="fas fa-tasks mr-2"></i>任务管理
                </h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>URL</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>进度</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tasks-table-body">
                            <!-- 任务列表将通过JavaScript动态添加 -->
                            <tr>
                                <td colspan="6" class="text-center">暂无任务</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 历史记录 -->
        <div id="history" class="card card-hover shadow-lg mb-5 transform-on-hover">
            <div class="card-header bg-success text-white">
                <h2 class="mb-0">
                    <i class="fas fa-history mr-2"></i>历史记录
                </h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>URL</th>
                                <th>时间</th>
                                <th>结果</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- 历史记录将通过JavaScript动态添加 -->
                            <tr>
                                <td colspan="4" class="text-center">暂无历史记录</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div id="settings" class="card card-hover shadow-lg mb-5 transform-on-hover">
            <div class="card-header bg-info text-white">
                <h2 class="mb-0">
                    <i class="fas fa-cog mr-2"></i>设置
                </h2>
            </div>
            <div class="card-body">
                <!-- 基本设置 -->
                <div class="mb-5">
                    <h4 class="mb-3"><i class="fas fa-sliders-h mr-2"></i>基本设置</h4>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="save-path" class="form-label">保存路径</label>
                            <div class="input-group">
                                <input type="text" id="save-path" class="form-control" required>
                                <button class="btn btn-outline-secondary" type="button" id="browse-path">
                                    <i class="fas fa-folder-open"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="download-threads" class="form-label">下载线程数</label>
                            <input type="number" id="download-threads" class="form-control" min="1" max="50" required>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="concurrent-tasks" class="form-label">并发任务数</label>
                            <input type="number" id="concurrent-tasks" class="form-control" min="1" max="10" required>
                        </div>
                        <div class="col-md-6">
                            <label for="save-format" class="form-label">保存格式</label>
                            <select id="save-format" class="form-select">
                                <option value="JPG">JPG</option>
                                <option value="PNG">PNG</option>
                                <option value="WebP">WebP</option>
                                <option value="原始格式">原始格式</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <!-- 高级设置 -->
                <div class="mb-5">
                    <h4 class="mb-3"><i class="fas fa-tools mr-2"></i>高级设置</h4>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="ffmpeg-path" class="form-label">FFmpeg路径</label>
                            <div class="input-group">
                                <input type="text" id="ffmpeg-path" class="form-control">
                                <button class="btn btn-outline-secondary" type="button" id="browse-ffmpeg">
                                    <i class="fas fa-folder-open"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="chromedriver-path" class="form-label">ChromeDriver路径</label>
                            <div class="input-group">
                                <input type="text" id="chromedriver-path" class="form-control">
                                <button class="btn btn-outline-secondary" type="button" id="browse-chromedriver">
                                    <i class="fas fa-folder-open"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="rename-format" class="form-label">重命名格式</label>
                            <input type="text" id="rename-format" class="form-control" placeholder="{id}_{num}">
                            <div class="form-text">可用变量: {id}, {num}, {title}, {site}</div>
                        </div>
                        <div class="col-md-6">
                            <label for="request-delay" class="form-label">请求延迟(秒)</label>
                            <input type="number" id="request-delay" class="form-control" min="0" max="10" step="0.1">
                        </div>
                    </div>
                </div>
                
                <!-- 功能开关 -->
                <div class="mb-5">
                    <h4 class="mb-3"><i class="fas fa-toggle-on mr-2"></i>功能开关</h4>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="download-video">
                                <label class="form-check-label" for="download-video">下载视频</label>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="clipboard-monitor">
                                <label class="form-check-label" for="clipboard-monitor">剪贴板监控</label>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="debug-mode">
                                <label class="form-check-label" for="debug-mode">调试模式</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-4 mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="unattended-mode">
                                <label class="form-check-label" for="unattended-mode">无人值守模式</label>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 自定义标签 -->
                <div class="mb-5">
                    <h4 class="mb-3"><i class="fas fa-tags mr-2"></i>自定义标签</h4>
                    <div class="row mb-4">
                        <div class="col-md-12">
                            <label for="custom-tags" class="form-label">默认标签 (用逗号分隔)</label>
                            <input type="text" id="custom-tags" class="form-control" placeholder="例如: 标签1, 标签2, 标签3">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="save-settings">
                    <i class="fas fa-save mr-2"></i>保存设置
                </button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 PuchiPix - 图像抓取工具</p>
        </div>
    </footer>

    <!-- 加载动画 -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;"></div>
            <p class="mt-2">正在处理...</p>
        </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container">
        <!-- Toast将通过JavaScript动态添加 -->
    </div>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
