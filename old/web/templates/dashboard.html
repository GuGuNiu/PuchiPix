<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PuchiPix - 主页</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-image mr-2"></i>PuchiPix
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">主页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/tasks">任务管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/history">历史记录</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/settings">设置</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <div class="main-content">
        <div class="container mt-5 pt-5">
        <!-- 欢迎面板 -->
        <div class="card card-hover shadow-lg mb-5 transform-on-hover">
            <div class="card-body">
                <h1 class="text-center mb-4">欢迎使用 PuchiPix</h1>
                <p class="text-center text-muted mb-5">高效的图像抓取工具</p>
                
                <!-- 添加任务表单 -->
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <form id="task-form" class="mb-5">
                            <div class="input-group">
                                <input type="text" id="url-input" class="form-control form-control-lg" placeholder="输入要抓取的URL..." required>
                                <button class="btn btn-outline-secondary" type="button" id="clipboard-btn" onclick="createTaskFromClipboard()">
                                    <i class="fas fa-paste"></i>
                                </button>
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-download mr-2"></i>开始抓取
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- 简化的统计卡片 -->
                <div class="row">
                    <div class="col-md-4 mb-4">
                        <div class="card bg-primary text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-tasks fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">总任务数</h5>
                                <p class="card-text display-4" id="total-tasks">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-success text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-check-circle fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">成功任务</h5>
                                <p class="card-text display-4" id="success-tasks">0</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-warning text-white h-100">
                            <div class="card-body text-center">
                                <i class="fas fa-spinner fa-3x mb-3 opacity-75"></i>
                                <h5 class="card-title">进行中</h5>
                                <p class="card-text display-4" id="running-tasks">0</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2024 PuchiPix - 图像抓取工具</p>
        </div>
    </footer>

    <!-- 加载动画 -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;"></div>
            <p class="mt-2">正在处理...</p>
        </div>
    </div>

    <!-- Toast通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container">
        <!-- Toast将通过JavaScript动态添加 -->
    </div>

    <!-- 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
