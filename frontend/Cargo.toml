[package]
name = "puchipix-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-net = "0.5"
gloo-console = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlElement", "InputEvent", "MouseEvent", "Event", "KeyboardEvent", "FormData", "Url", "Location"] }
wasm-logger = "0.2"
log = "0.4"
yew-router = "0.18"
gloo-timers = { version = "0.3", features = ["futures"] }