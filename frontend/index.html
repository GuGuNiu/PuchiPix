<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="description" content="PuchiPix - Browser-automated M3U8 video downloading tool" />
    <!--
      Dancing Script 字体已本地化（/fonts/dancing-script-700.woff2，见 tokens.scss 的
      @font-face，font-display: swap）。不再加载 fonts.googleapis.com 的渲染阻塞样式表，
      避免跨域慢请求拖慢首屏。
    -->
    <title>PuchiPix - Puch Puch ~~</title>
  </head>
  <body>
    <!-- Prevent theme flash: read cookie before React renders -->
    <script>
      (function() {
        var match = document.cookie.match(/(?:^|;\s*)theme=([^;]*)/);
        var theme = match ? match[1] : null;
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
